<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .loader {
         border: 5px solid lightgray;  border-top: 5px solid blue; border-radius: 50%;  width: 40px; height: 40px;  animation: spin 1s linear infinite;
        }
        
 @keyframes spin {  
    100% { transform: rotate(360deg); }
}
    </style>

    <title>Spinner</title>
</head>
<body>
    <h1>Loading spinner</h1>
    <div class="loader">
    </div>
</body>
</html>
